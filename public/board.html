<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TUZ Leaderboard</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#09090c;color:#fff;font:15px system-ui;padding:22px}.wrap{max-width:760px;margin:auto}.hero,.board{border:1px solid #292932;background:#141419;border-radius:28px}.hero{padding:28px;margin-bottom:14px}h1{font-size:48px;letter-spacing:-.05em;margin:0 0 8px}.muted{color:#888}.board{padding:12px}.row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:15px;border-top:1px solid #25252d}.row:first-child{border-top:0}.rank{font-size:24px;text-align:center}.name{font-weight:700}.score{font-size:22px;font-weight:900}</style><main class="wrap"><section class="hero"><div class="muted">LIVE</div><h1 id="heading">TUZ Leaderboard</h1><div>Всего упоминаний: <b id="total">—</b></div></section><section id="board" class="board">Загрузка…</section></main><script>
const key=location.pathname.split("/").filter(Boolean).pop(),medals=["🥇","🥈","🥉"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
async function refresh(){
  try{
    const x=await fetch("/api/board/"+encodeURIComponent(key),{cache:"no-store"});
    if(!x.ok)return;
    const d=await x.json();
    document.title=d.title+" — TUZ Leaderboard";
    document.getElementById("heading").textContent=d.title+" — TUZ";
    document.getElementById("total").textContent=d.total;
    document.getElementById("board").innerHTML=d.leaders.length?d.leaders.map(x=>`<div class="row"><div class="rank">${medals[x.rank-1]||x.rank+"."}</div><div class="name">${esc(x.name)}</div><div class="score">${x.score}</div></div>`).join(""):"Пока ни одного упоминания.";
  }catch{}
}
refresh();setInterval(refresh,2000);
</script></html>
